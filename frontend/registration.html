<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="/logo.png" />
    <link rel="stylesheet" href="./style.css" />

    <title>Регистрация - Amemory</title>
  </head>

  <body>
    <header id="site-header" class="fixed top-0 left-0 z-50 w-full">
      <nav class="container mx-auto py-3 flex items-center justify-between">
        <ul class="flex justify-between items-center lg:w-fit w-full">
          <li>
            <a href="/">
              <figure class="w-[100px]">
                <img
                  class="w-full h-full"
                  src="/health-doc-logo.png"
                  alt="Logo Health Doc"
                />
              </figure>
            </a>
          </li>
          <li class="relative w-10 lg:hidden">
            <div class="trigger">
              <svg class="bars hamburger-bars" viewBox="0 0 100 100">
                <path
                  class="line top"
                  d="m 30,33 h 40 c 13.100415,0 14.380204,31.80258 6.899646,33.421777 -24.612039,5.327373 9.016154,-52.337577 -12.75751,-30.563913 l -28.284272,28.284272"
                ></path>
                <path
                  class="line middle"
                  d="m 70,50 c 0,0 -32.213436,0 -40,0 -7.786564,0 -6.428571,-4.640244 -6.428571,-8.571429 0,-5.895471 6.073743,-11.783399 12.286435,-5.570707 6.212692,6.212692 28.284272,28.284272 28.284272,28.284272"
                ></path>
                <path
                  class="line bottom"
                  d="m 69.575405,67.073826 h -40 c -13.100415,0 -14.380204,-31.80258 -6.899646,-33.421777 24.612039,-5.327373 -9.016154,52.337577 12.75751,30.563913 l 28.284272,-28.284272"
                ></path>
              </svg>
            </div>
          </li>
        </ul>
        <ul class="items-center gap-[26px] lg:flex hidden">
          <li>
            <a class="text-secondarygrey font-medium" href="/about">О нас</a>
          </li>
          <li>
            <a class="text-secondarygrey font-medium" href="/blog">Услуги</a>
          </li>
          <li>
            <a class="text-secondarygrey font-medium" href="/testimonial">Пример страницы</a>
          </li>
          <li>
            <a class="text-secondarygrey font-medium" href="/contact">Контакты</a>
          </li>
        </ul>
        <ul class="lg:flex hidden">
          <li>
            <a class="button btn-primary" href="/login">
              <svg
                class="icon-circle"
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle cx="8" cy="8" r="8" fill="white" />
              </svg>
              <span>Помощь</span>
            </a>
          </li>
        </ul>
        <ul
          class="lg:hidden flex flex-col absolute top-[58px] -left-[100%] duration-500 w-full h-screen bg-white mobileNav px-4"
        >
          <li>
            <a class="text-secondarygrey font-medium" href="/about">О нас</a>
          </li>
          <li>
            <a class="text-secondarygrey font-medium" href="/blog">Услуги</a>
          </li>
          <li>
            <a class="text-secondarygrey font-medium" href="/contact"
              >Контакты</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main id="site-main" class="min-h-screen flex items-center justify-center pt-[104px] pb-10">
      <div class="login-container">
        <div class="login-box">
          <div class="login-form">
            <div class="logo"></div>
            <span class="header">Создать аккаунт</span>

            <!-- Табы для выбора способа регистрации -->
            <div class="reg-tabs">
              <button type="button" class="reg-tab" data-tab="email">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <span>Email</span>
              </button>
              <button type="button" class="reg-tab active" data-tab="phone">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                  <line x1="12" y1="18" x2="12.01" y2="18"></line>
                </svg>
                <span>Телефон</span>
              </button>
            </div>

            <!-- Форма регистрации по Email -->
            <form class="reg-form hidden" id="email-form">
              <input type="email" placeholder="Электронная почта" class="input" required />
              <input type="password" placeholder="Пароль" class="input" required minlength="8" />
              <input type="password" placeholder="Подтвердите пароль" class="input" required minlength="8" />
              <div class="password-hint">Минимум 8 символов</div>
              <button type="submit" class="button sign-in">Зарегистрироваться</button>
            </form>

            <!-- Форма регистрации по телефону -->
            <form class="reg-form" id="phone-form">
              <div class="phone-input-wrapper">
                <span class="phone-prefix">+7</span>
                <input type="tel" placeholder="999 123 45 67" class="input phone-input" pattern="[0-9]{10}" maxlength="10" required />
              </div>
              <button type="submit" class="button sign-in" id="send-code-btn">Получить код</button>

              <!-- Поле для ввода кода (скрыто по умолчанию) -->
              <div class="code-input-wrapper hidden" id="code-wrapper">
                <input type="text" placeholder="Введите код из SMS" class="input" maxlength="6" pattern="[0-9]{6}" />
                <button type="button" class="button sign-in">Подтвердить</button>
                <button type="button" class="resend-code">Отправить код повторно</button>
              </div>
            </form>

            <div class="divider">
              <span>или</span>
            </div>

            <!-- Регистрация через Google -->
            <button class="button google-sign-in">
              <svg
                class="icon"
                viewBox="-3 0 262 262"
                xmlns="http://www.w3.org/2000/svg"
                preserveAspectRatio="xMidYMid"
                fill="#000000"
              >
                <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                <g
                  id="SVGRepo_tracerCarrier"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                ></g>
                <g id="SVGRepo_iconCarrier">
                  <path
                    d="M255.878 133.451c0-10.734-.871-18.567-2.756-26.69H130.55v48.448h71.947c-1.45 12.04-9.283 30.172-26.69 42.356l-.244 1.622 38.755 30.023 2.685.268c24.659-22.774 38.875-56.282 38.875-96.027"
                    fill="#4285F4"
                  ></path>
                  <path
                    d="M130.55 261.1c35.248 0 64.839-11.605 86.453-31.622l-41.196-31.913c-11.024 7.688-25.82 13.055-45.257 13.055-34.523 0-63.824-22.773-74.269-54.25l-1.531.13-40.298 31.187-.527 1.465C35.393 231.798 79.49 261.1 130.55 261.1"
                    fill="#34A853"
                  ></path>
                  <path
                    d="M56.281 156.37c-2.756-8.123-4.351-16.827-4.351-25.82 0-8.994 1.595-17.697 4.206-25.82l-.073-1.73L15.26 71.312l-1.335.635C5.077 89.644 0 109.517 0 130.55s5.077 40.905 13.925 58.602l42.356-32.782"
                    fill="#FBBC05"
                  ></path>
                  <path
                    d="M130.55 50.479c24.514 0 41.05 10.589 50.479 19.438l36.844-35.974C195.245 12.91 165.798 0 130.55 0 79.49 0 35.393 29.301 13.925 71.947l42.211 32.783c10.59-31.477 39.891-54.251 74.414-54.251"
                    fill="#EB4335"
                  ></path>
                </g>
              </svg>
              <span class="span two">Регистрация через Google</span>
            </button>

            <p class="footer">
              Уже есть аккаунт?
              <a href="/login" class="link">Войти</a>
            </p>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="./assets/main.js"></script>
    <script>
      // Переключение табов
      document.querySelectorAll('.reg-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          // Убираем active у всех табов
          document.querySelectorAll('.reg-tab').forEach(t => t.classList.remove('active'));
          // Добавляем active текущему
          tab.classList.add('active');

          // Скрываем все формы
          document.querySelectorAll('.reg-form').forEach(form => form.classList.add('hidden'));
          // Показываем нужную форму
          const formId = tab.dataset.tab + '-form';
          document.getElementById(formId).classList.remove('hidden');
        });
      });

      // Обработка отправки кода на телефон
      document.getElementById('phone-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const codeWrapper = document.getElementById('code-wrapper');
        const sendBtn = document.getElementById('send-code-btn');

        if (codeWrapper.classList.contains('hidden')) {
          // Показываем поле для ввода кода
          codeWrapper.classList.remove('hidden');
          sendBtn.classList.add('hidden');
        }
      });

      // Повторная отправка кода
      document.querySelector('.resend-code')?.addEventListener('click', () => {
        alert('Код отправлен повторно');
      });

      // Валидация совпадения паролей
      document.getElementById('email-form').addEventListener('submit', (e) => {
        const passwords = e.target.querySelectorAll('input[type="password"]');
        if (passwords[0].value !== passwords[1].value) {
          e.preventDefault();
          alert('Пароли не совпадают');
        }
      });
    </script>
  </body>
</html>
