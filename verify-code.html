<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="/logo.png" />
    <link rel="stylesheet" href="./style.css" />

    <title>Подтверждение кода - Amemory</title>
    <style>
      .code-inputs {
        display: flex;
        gap: 8px;
        justify-content: center;
        margin: 20px 0;
      }

      .code-input {
        width: 42px;
        height: 50px;
        text-align: center;
        font-size: 20px;
        font-weight: 600;
        border: 1px solid transparent;
        border-radius: 12px;
        outline: none;
        transition: all 0.2s ease;
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }

      .code-input:focus {
        border-color: #fff;
        background: rgba(255, 255, 255, 0.15);
      }

      .code-input.filled {
        border-color: #34A853;
        background: rgba(52, 168, 83, 0.2);
      }

      .code-input.error {
        border-color: #EB4335;
        background: rgba(235, 67, 53, 0.2);
        animation: shake 0.3s ease;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }

      .phone-display {
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
        text-align: center;
        margin-bottom: 8px;
      }

      .phone-number {
        font-weight: 600;
        color: white;
      }

      .timer {
        text-align: center;
        color: rgba(255, 255, 255, 0.85);
        font-size: 13px;
        margin-top: 16px;
      }

      .timer-count {
        font-weight: 600;
        color: #4da6ff;
      }

      .resend-link {
        color: #4da6ff;
        cursor: pointer;
        text-decoration: underline;
      }

      .resend-link:hover {
        color: #80c0ff;
      }

      .resend-link.disabled {
        color: rgba(255, 255, 255, 0.4);
        cursor: not-allowed;
        text-decoration: none;
      }

      /* Увеличиваем высоту контейнера */
      .login-container {
        height: 520px;
      }

      .login-container .login-box {
        height: 520px;
      }

      .login-container .login-form {
        min-height: 480px;
      }
    </style>
  </head>

  <body>
    <header id="site-header" class="fixed top-0 left-0 z-50 w-full">
      <nav class="container mx-auto py-3 flex items-center justify-between">
        <ul class="flex justify-between items-center lg:w-fit w-full">
          <li>
            <a href="/">
              <figure class="w-[100px]">
                <img
                  class="w-full h-full"
                  src="/health-doc-logo.png"
                  alt="Logo Health Doc"
                />
              </figure>
            </a>
          </li>
          <li class="relative w-10 lg:hidden">
            <div class="trigger">
              <svg class="bars hamburger-bars" viewBox="0 0 100 100">
                <path
                  class="line top"
                  d="m 30,33 h 40 c 13.100415,0 14.380204,31.80258 6.899646,33.421777 -24.612039,5.327373 9.016154,-52.337577 -12.75751,-30.563913 l -28.284272,28.284272"
                ></path>
                <path
                  class="line middle"
                  d="m 70,50 c 0,0 -32.213436,0 -40,0 -7.786564,0 -6.428571,-4.640244 -6.428571,-8.571429 0,-5.895471 6.073743,-11.783399 12.286435,-5.570707 6.212692,6.212692 28.284272,28.284272 28.284272,28.284272"
                ></path>
                <path
                  class="line bottom"
                  d="m 69.575405,67.073826 h -40 c -13.100415,0 -14.380204,-31.80258 -6.899646,-33.421777 24.612039,-5.327373 -9.016154,52.337577 12.75751,30.563913 l 28.284272,-28.284272"
                ></path>
              </svg>
            </div>
          </li>
        </ul>
        <ul class="items-center gap-[26px] lg:flex hidden">
          <li>
            <a class="text-secondarygrey font-medium" href="/about">О нас</a>
          </li>
          <li>
            <a class="text-secondarygrey font-medium" href="/blog">Услуги</a>
          </li>
          <li>
            <a class="text-secondarygrey font-medium" href="/testimonial">Пример страницы</a>
          </li>
          <li>
            <a class="text-secondarygrey font-medium" href="/contact">Контакты</a>
          </li>
        </ul>
        <ul class="lg:flex hidden">
          <li>
            <a class="button btn-primary" href="/login">
              <svg
                class="icon-circle"
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle cx="8" cy="8" r="8" fill="white" />
              </svg>
              <span>Помощь</span>
            </a>
          </li>
        </ul>
        <ul
          class="lg:hidden flex flex-col absolute top-[58px] -left-[100%] duration-500 w-full h-screen bg-white mobileNav px-4"
        >
          <li>
            <a class="text-secondarygrey font-medium" href="/about">О нас</a>
          </li>
          <li>
            <a class="text-secondarygrey font-medium" href="/blog">Услуги</a>
          </li>
          <li>
            <a class="text-secondarygrey font-medium" href="/contact"
              >Контакты</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main id="site-main" class="min-h-screen flex items-center justify-center pt-[104px] pb-10">
      <div class="login-container">
        <div class="login-box">
          <div class="login-form">
            <div class="logo"></div>
            <span class="header">Введите код</span>

            <p class="phone-display">
              Мы отправили SMS с кодом на номер<br>
              <span class="phone-number" id="phone-display">+7 (***) ***-**-**</span>
            </p>

            <div class="code-inputs">
              <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code" />
              <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" />
              <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" />
              <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" />
              <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" />
              <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" />
            </div>

            <button type="button" class="button sign-in" id="verify-btn">Подтвердить</button>

            <div class="timer" id="timer-container">
              Отправить код повторно через <span class="timer-count" id="timer">60</span> сек
            </div>
            <div class="timer hidden" id="resend-container">
              <span class="resend-link" id="resend-btn">Отправить код повторно</span>
            </div>

            <p class="footer" style="margin-top: 24px;">
              <a href="/forgot-password" class="link">Изменить номер телефона</a>
            </p>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="./assets/main.js"></script>
    <script>
      const inputs = document.querySelectorAll('.code-input');
      const verifyBtn = document.getElementById('verify-btn');
      const timerContainer = document.getElementById('timer-container');
      const resendContainer = document.getElementById('resend-container');
      const timerSpan = document.getElementById('timer');
      const resendBtn = document.getElementById('resend-btn');

      // Получаем номер телефона из URL параметров
      const urlParams = new URLSearchParams(window.location.search);
      const phone = urlParams.get('phone');
      if (phone) {
        const maskedPhone = '+7 (' + phone.substring(0, 3) + ') ***-**-' + phone.substring(8, 10);
        document.getElementById('phone-display').textContent = maskedPhone;
      }

      // Автофокус на первое поле
      inputs[0].focus();

      // Обработка ввода
      inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          const value = e.target.value;

          // Разрешаем только цифры
          if (!/^\d*$/.test(value)) {
            e.target.value = '';
            return;
          }

          if (value.length === 1) {
            input.classList.add('filled');
            input.classList.remove('error');

            // Переход к следующему полю
            if (index < inputs.length - 1) {
              inputs[index + 1].focus();
            }
          }

          // Обработка вставки полного кода
          if (value.length > 1) {
            const digits = value.split('').filter(d => /\d/.test(d));
            digits.forEach((digit, i) => {
              if (inputs[index + i]) {
                inputs[index + i].value = digit;
                inputs[index + i].classList.add('filled');
              }
            });
            const lastIndex = Math.min(index + digits.length - 1, inputs.length - 1);
            inputs[lastIndex].focus();
          }
        });

        // Обработка удаления
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && index > 0) {
            inputs[index - 1].focus();
            inputs[index - 1].value = '';
            inputs[index - 1].classList.remove('filled');
          }
        });

        // Обработка вставки из буфера
        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pastedData = e.clipboardData.getData('text');
          const digits = pastedData.split('').filter(d => /\d/.test(d));

          digits.forEach((digit, i) => {
            if (inputs[i]) {
              inputs[i].value = digit;
              inputs[i].classList.add('filled');
            }
          });

          const lastIndex = Math.min(digits.length - 1, inputs.length - 1);
          if (lastIndex >= 0) {
            inputs[lastIndex].focus();
          }
        });
      });

      // Подтверждение кода
      verifyBtn.addEventListener('click', () => {
        const code = Array.from(inputs).map(input => input.value).join('');

        if (code.length !== 6) {
          inputs.forEach(input => {
            if (!input.value) {
              input.classList.add('error');
            }
          });
          return;
        }

        // Здесь будет проверка кода на сервере
        // Пока просто переходим на страницу смены пароля
        window.location.href = '/reset-password?phone=' + (phone || '');
      });

      // Таймер для повторной отправки
      let timeLeft = 60;
      const timerInterval = setInterval(() => {
        timeLeft--;
        timerSpan.textContent = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          timerContainer.classList.add('hidden');
          resendContainer.classList.remove('hidden');
        }
      }, 1000);

      // Повторная отправка кода
      resendBtn.addEventListener('click', () => {
        // Сброс полей
        inputs.forEach(input => {
          input.value = '';
          input.classList.remove('filled', 'error');
        });
        inputs[0].focus();

        // Перезапуск таймера
        timeLeft = 60;
        timerSpan.textContent = timeLeft;
        resendContainer.classList.add('hidden');
        timerContainer.classList.remove('hidden');

        const newInterval = setInterval(() => {
          timeLeft--;
          timerSpan.textContent = timeLeft;

          if (timeLeft <= 0) {
            clearInterval(newInterval);
            timerContainer.classList.add('hidden');
            resendContainer.classList.remove('hidden');
          }
        }, 1000);

        alert('Код отправлен повторно');
      });
    </script>
  </body>
</html>
