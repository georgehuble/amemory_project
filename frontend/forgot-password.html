<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="/logo.png" />
    <link rel="stylesheet" href="./style.css" />

    <title>Восстановление пароля - Amemory</title>
  </head>

  <body>
    <header id="site-header" class="fixed top-0 left-0 z-50 w-full">
      <nav class="container mx-auto py-3 flex items-center justify-between">
        <ul class="flex justify-between items-center lg:w-fit w-full">
          <li>
            <a href="/">
              <figure class="w-[100px]">
                <img
                  class="w-full h-full"
                  src="/health-doc-logo.png"
                  alt="Logo Health Doc"
                />
              </figure>
            </a>
          </li>
          <li class="relative w-10 lg:hidden">
            <div class="trigger">
              <svg class="bars hamburger-bars" viewBox="0 0 100 100">
                <path
                  class="line top"
                  d="m 30,33 h 40 c 13.100415,0 14.380204,31.80258 6.899646,33.421777 -24.612039,5.327373 9.016154,-52.337577 -12.75751,-30.563913 l -28.284272,28.284272"
                ></path>
                <path
                  class="line middle"
                  d="m 70,50 c 0,0 -32.213436,0 -40,0 -7.786564,0 -6.428571,-4.640244 -6.428571,-8.571429 0,-5.895471 6.073743,-11.783399 12.286435,-5.570707 6.212692,6.212692 28.284272,28.284272 28.284272,28.284272"
                ></path>
                <path
                  class="line bottom"
                  d="m 69.575405,67.073826 h -40 c -13.100415,0 -14.380204,-31.80258 -6.899646,-33.421777 24.612039,-5.327373 -9.016154,52.337577 12.75751,30.563913 l 28.284272,-28.284272"
                ></path>
              </svg>
            </div>
          </li>
        </ul>
        <ul class="items-center gap-[26px] lg:flex hidden">
          <li>
            <a class="text-secondarygrey font-medium" href="/about">О нас</a>
          </li>
          <li>
            <a class="text-secondarygrey font-medium" href="/blog">Услуги</a>
          </li>
          <li>
            <a class="text-secondarygrey font-medium" href="/testimonial">Пример страницы</a>
          </li>
          <li>
            <a class="text-secondarygrey font-medium" href="/contact">Контакты</a>
          </li>
        </ul>
        <ul class="lg:flex hidden">
          <li>
            <a class="button btn-primary" href="/login">
              <svg
                class="icon-circle"
                width="16"
                height="16"
                viewBox="0 0 16 16"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle cx="8" cy="8" r="8" fill="white" />
              </svg>
              <span>Помощь</span>
            </a>
          </li>
        </ul>
        <ul
          class="lg:hidden flex flex-col absolute top-[58px] -left-[100%] duration-500 w-full h-screen bg-white mobileNav px-4"
        >
          <li>
            <a class="text-secondarygrey font-medium" href="/about">О нас</a>
          </li>
          <li>
            <a class="text-secondarygrey font-medium" href="/blog">Услуги</a>
          </li>
          <li>
            <a class="text-secondarygrey font-medium" href="/contact"
              >Контакты</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main id="site-main" class="min-h-screen flex items-center justify-center pt-[104px] pb-10">
      <div class="login-container">
        <div class="login-box">
          <div class="login-form">
            <div class="logo"></div>
            <span class="header">Восстановление пароля</span>
            <p class="subheader" style="color: #666; font-size: 14px; margin-bottom: 20px; text-align: center;">
              Выберите способ восстановления доступа к аккаунту
            </p>

            <!-- Табы для выбора способа восстановления -->
            <div class="reg-tabs">
              <button type="button" class="reg-tab" data-tab="email">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                  <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                <span>Email</span>
              </button>
              <button type="button" class="reg-tab active" data-tab="phone">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                  <line x1="12" y1="18" x2="12.01" y2="18"></line>
                </svg>
                <span>Телефон</span>
              </button>
            </div>

            <!-- Форма восстановления по Email -->
            <form class="reg-form hidden" id="email-form">
              <input type="email" placeholder="Введите вашу электронную почту" class="input" required />
              <button type="submit" class="button sign-in" id="send-email-btn">Отправить ссылку</button>

              <!-- Сообщение об успешной отправке -->
              <div class="success-message hidden" id="email-success">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34A853" stroke-width="2">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span>Ссылка для восстановления отправлена на вашу почту</span>
              </div>
            </form>

            <!-- Форма восстановления по телефону -->
            <form class="reg-form" id="phone-form">
              <div class="phone-input-wrapper">
                <span class="phone-prefix">+7</span>
                <input type="tel" placeholder="999 123 45 67" class="input phone-input" pattern="[0-9]{10}" maxlength="10" required />
              </div>
              <button type="submit" class="button sign-in" id="send-code-btn">Получить код</button>
            </form>

            <p class="footer">
              Вспомнили пароль?
              <a href="/login" class="link">Войти</a>
            </p>
            <p class="footer" style="margin-top: 8px;">
              Нет аккаунта?
              <a href="/registration" class="link">Зарегистрироваться</a>
            </p>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="./assets/main.js"></script>
    <script>
      // Переключение табов
      document.querySelectorAll('.reg-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          // Убираем active у всех табов
          document.querySelectorAll('.reg-tab').forEach(t => t.classList.remove('active'));
          // Добавляем active текущему
          tab.classList.add('active');

          // Скрываем все формы
          document.querySelectorAll('.reg-form').forEach(form => form.classList.add('hidden'));
          // Показываем нужную форму
          const formId = tab.dataset.tab + '-form';
          document.getElementById(formId).classList.remove('hidden');
        });
      });

      // Обработка отправки кода на телефон
      document.getElementById('phone-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const phoneInput = document.querySelector('.phone-input');
        const phone = phoneInput.value.replace(/\D/g, '');

        if (phone.length === 10) {
          // Переход на страницу ввода кода
          window.location.href = '/verify-code?phone=' + phone;
        }
      });

      // Обработка формы email
      document.getElementById('email-form').addEventListener('submit', (e) => {
        e.preventDefault();
        // Показываем сообщение об успехе
        document.getElementById('email-success').classList.remove('hidden');
        document.getElementById('send-email-btn').classList.add('hidden');
      });
    </script>
  </body>
</html>
